endpoints:
  http:
    type: HTTP
    port: 8080
    visibility:
      - external
container:
  env:
    - key: ASPNETCORE_ENVIRONMENT
      value: "Production"
    - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
      value: "true"
    - key: AllowedHosts
      value: "*"
    - key: HTTP_PORTS
      value: "8080"
    - key: ConnectionStrings__wcmdb
      value: "Host=pg-opench.postgres.database.azure.com;Port=5432;Username=wcm-api-identity;Database=wcmdb;SSL Mode=require"
    - key: AZURE_CLIENT_ID
      value: "fda04deb-cc9a-4918-813d-aad0ff6073b6"
    - key: PGGSSENCMODE
      value: "disable"
