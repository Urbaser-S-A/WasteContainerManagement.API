apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: wcm-api-workload

endpoints:
  - name: http
    type: HTTP
    port: 8080
    visibility:
      - external

configurations:
  env:
    # LocalDevelopment keeps auth bypassed and enables the OpenAPI/Scalar UI.
    - name: ASPNETCORE_ENVIRONMENT
      value: "LocalDevelopment"
    - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
      value: "true"
    - name: AllowedHosts
      value: "*"
    - name: HTTP_PORTS
      value: "8080"
    # External base path the gateway serves this app under (it strips the prefix before
    # forwarding). Makes OpenAPI `servers` and generated URLs include it so Scalar "try it"
    # and API clients call the correct path. Overridden by an X-Forwarded-Prefix header if sent.
    - name: EXTERNAL_BASE_PATH
      value: "/wcm-api-http"
    # Embedded SQLite database — no external database or cloud dependency.
    # Stored under a writable path; data is ephemeral (lost on pod restart)
    # until a persistent-volume trait is attached.
    - name: ConnectionStrings__wcmdb
      value: "Data Source=/tmp/wcm-api/wcm.db"
