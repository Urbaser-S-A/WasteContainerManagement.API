apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: wcm-api-workload

endpoints:
  - name: http
    type: HTTP
    port: 8080
    visibility:
      - external

configurations:
  env:
    - name: ASPNETCORE_ENVIRONMENT
      value: "LocalDevelopment"
    - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
      value: "true"
    - name: AllowedHosts
      value: "*"
    - name: HTTP_PORTS
      value: "8080"
    - name: ConnectionStrings__wcmdb
      value: "Host=pg-opench.postgres.database.azure.com;Port=5432;Username=wcm-api-identity;Database=wcmdb;SSL Mode=require"
    - name: AZURE_CLIENT_ID
      value: "fda04deb-cc9a-4918-813d-aad0ff6073b6"
    - name: PGGSSENCMODE
      value: "disable"
