apiVersion: openchoreo.dev/v1alpha1
kind: ClusterComponentType
metadata:
  name: service-subdomain
  annotations:
    openchoreo.dev/display-name: "service-subdomain"
    openchoreo.dev/description: >-
      A long-running request-serving component with subdomain-based routing.
      Each endpoint gets its own subdomain instead of a path prefix.
spec:
  allowedTraits:
  - kind: ClusterTrait
    name: observability-alert-rule
  allowedWorkflows:
  - kind: ClusterWorkflow
    name: paketo-buildpacks-builder
  - kind: ClusterWorkflow
    name: gcp-buildpacks-builder
  - kind: ClusterWorkflow
    name: dockerfile-builder
  - kind: ClusterWorkflow
    name: ballerina-buildpack-builder
  - kind: ClusterWorkflow
    name: wolfi-buildpacks-builder
  environmentConfigs:
    openAPIV3Schema:
      $defs:
        ResourceQuantity:
          default: {}
          properties:
            cpu:
              default: 100m
              type: string
            memory:
              default: 256Mi
              type: string
          type: object
        ResourceRequirements:
          default: {}
          properties:
            limits:
              $ref: '#/$defs/ResourceQuantity'
            requests:
              $ref: '#/$defs/ResourceQuantity'
          type: object
      properties:
        imagePullPolicy:
          default: IfNotPresent
          enum:
          - Always
          - IfNotPresent
          - Never
          type: string
        replicas:
          default: 1
          minimum: 0
          type: integer
        resources:
          $ref: '#/$defs/ResourceRequirements'
        azureWorkloadIdentityClientId:
          description: "Azure managed identity client ID for workload identity. Leave empty to disable."
          default: ""
          type: string
      type: object
  resources:
  # ServiceAccount for Azure Workload Identity (only when clientId is set)
  - id: service-account
    includeWhen: ${environmentConfigs.azureWorkloadIdentityClientId != ""}
    targetPlane: dataplane
    template:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        annotations:
          azure.workload.identity/client-id: ${environmentConfigs.azureWorkloadIdentityClientId}
        labels: ${metadata.labels}
        name: ${metadata.componentName}
        namespace: ${metadata.namespace}
  - id: deployment
    targetPlane: dataplane
    template:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels: ${metadata.labels}
        name: ${metadata.name}
        namespace: ${metadata.namespace}
      spec:
        replicas: ${environmentConfigs.replicas}
        selector:
          matchLabels: ${metadata.podSelectors}
        template:
          metadata:
            labels: |
              ${environmentConfigs.azureWorkloadIdentityClientId != "" ?
                oc_merge(metadata.podSelectors, {"azure.workload.identity/use": "true"}) :
                metadata.podSelectors}
          spec:
            serviceAccountName: |
              ${environmentConfigs.azureWorkloadIdentityClientId != "" ? metadata.componentName : oc_omit()}
            containers:
            - args: |
                ${has(workload.container.args) ? workload.container.args : oc_omit()}
              command: |
                ${has(workload.container.command) ? workload.container.command : oc_omit()}
              env: ${connections.toContainerEnv()}
              envFrom: ${configurations.toContainerEnvFrom()}
              image: ${workload.container.image}
              imagePullPolicy: ${environmentConfigs.imagePullPolicy}
              name: main
              resources:
                limits:
                  cpu: ${environmentConfigs.resources.limits.cpu}
                  memory: ${environmentConfigs.resources.limits.memory}
                requests:
                  cpu: ${environmentConfigs.resources.requests.cpu}
                  memory: ${environmentConfigs.resources.requests.memory}
              volumeMounts: ${configurations.toContainerVolumeMounts()}
            volumes: ${configurations.toVolumes()}
  - id: service
    includeWhen: ${size(workload.endpoints) > 0}
    targetPlane: dataplane
    template:
      apiVersion: v1
      kind: Service
      metadata:
        labels: ${metadata.labels}
        name: ${metadata.componentName}
        namespace: ${metadata.namespace}
      spec:
        ports: ${workload.toServicePorts()}
        selector: ${metadata.podSelectors}
        type: ClusterIP
  # Subdomain-based external HTTPRoute: each endpoint gets its own subdomain
  # e.g. wcm-api-http.development-default.apps.openchoreo.messier.es
  - forEach: '${workload.endpoints.transformList(name, ep, ("external" in ep.visibility
      && ep.type in ["HTTP", "REST", "GraphQL", "Websocket"]) ? [name] : []).flatten()}'
    id: httproute-external
    targetPlane: dataplane
    template:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint,
          "openchoreo.dev/endpoint-visibility": "external"})}'
        name: ${oc_generate_name(metadata.componentName, endpoint)}
        namespace: ${metadata.namespace}
      spec:
        hostnames: |
          ${[gateway.ingress.external.?http, gateway.ingress.external.?https]
            .filter(g, g.hasValue()).map(g, g.value().host).distinct()
            .map(h, oc_dns_label(endpoint, metadata.componentName, metadata.environmentName, metadata.componentNamespace) + "." + h)}
        parentRefs:
        - name: ${gateway.ingress.external.name}
          namespace: ${gateway.ingress.external.namespace}
        rules:
        - backendRefs:
          - name: ${metadata.componentName}
            port: ${workload.endpoints[endpoint].port}
          matches:
          - path:
              type: PathPrefix
              value: /
    var: endpoint
  # Subdomain-based internal HTTPRoute
  - forEach: '${workload.endpoints.transformList(name, ep, ("internal" in ep.visibility
      && ep.type in ["HTTP", "REST", "GraphQL", "Websocket"]) ? [name] : []).flatten()}'
    id: httproute-internal
    targetPlane: dataplane
    template:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint,
          "openchoreo.dev/endpoint-visibility": "internal"})}'
        name: ${oc_generate_name(metadata.componentName, endpoint, "internal")}
        namespace: ${metadata.namespace}
      spec:
        hostnames: |
          ${[gateway.ingress.internal.?http, gateway.ingress.internal.?https]
            .filter(g, g.hasValue()).map(g, g.value().host).distinct()
            .map(h, oc_dns_label(endpoint, metadata.componentName, metadata.environmentName, metadata.componentNamespace) + "." + h)}
        parentRefs:
        - name: ${gateway.ingress.internal.name}
          namespace: ${gateway.ingress.internal.namespace}
        rules:
        - backendRefs:
          - name: ${metadata.componentName}
            port: ${workload.endpoints[endpoint].port}
          matches:
          - path:
              type: PathPrefix
              value: /
    var: endpoint
  - forEach: ${configurations.toConfigEnvsByContainer()}
    id: env-config
    targetPlane: dataplane
    template:
      apiVersion: v1
      data: |
        ${envConfig.envs.transformMapEntry(index, env, {env.name: env.value})}
      kind: ConfigMap
      metadata:
        name: ${envConfig.resourceName}
        namespace: ${metadata.namespace}
    var: envConfig
  - forEach: ${configurations.toConfigFileList()}
    id: file-config
    targetPlane: dataplane
    template:
      apiVersion: v1
      data:
        ${config.name}: |
          ${config.value}
      kind: ConfigMap
      metadata:
        name: ${config.resourceName}
        namespace: ${metadata.namespace}
    var: config
  - forEach: ${configurations.toSecretEnvsByContainer()}
    id: secret-env-external
    targetPlane: dataplane
    template:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: ${secretEnv.resourceName}
        namespace: ${metadata.namespace}
      spec:
        data: |
          ${secretEnv.envs.map(secret, {
            "secretKey": secret.name,
            "remoteRef": {
              "key": secret.remoteRef.key,
              "property": has(secret.remoteRef.property) ? secret.remoteRef.property : oc_omit()
            }
          })}
        refreshInterval: 15s
        secretStoreRef:
          kind: ClusterSecretStore
          name: ${dataplane.secretStore}
        target:
          creationPolicy: Owner
          name: ${secretEnv.resourceName}
    var: secretEnv
  - forEach: ${configurations.toSecretFileList()}
    id: secret-file-external
    targetPlane: dataplane
    template:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: ${file.resourceName}
        namespace: ${metadata.namespace}
      spec:
        data:
        - remoteRef:
            key: ${file.remoteRef.key}
            property: |
              ${has(file.remoteRef.property) ? file.remoteRef.property : oc_omit()}
          secretKey: ${file.name}
        refreshInterval: 15s
        secretStoreRef:
          kind: ClusterSecretStore
          name: ${dataplane.secretStore}
        target:
          creationPolicy: Owner
          name: ${file.resourceName}
    var: file
  validations:
  - message: Service components must have at least one endpoint. Use 'deployment/worker'
      for components without endpoints.
    rule: ${size(workload.endpoints) > 0}
  workloadType: deployment
