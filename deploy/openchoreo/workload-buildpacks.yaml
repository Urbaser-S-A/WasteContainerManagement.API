apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: wcm-api-buildpacks-workload
  namespace: urbaser
spec:
  owner:
    componentName: wcm-api-buildpacks
    projectName: urbaser
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility:
        - external
  container:
    image: acrurbaserocdp897.azurecr.io/default-urb-wcm-api-wcm-api-buildpacks:v1-518a4962
    env:
      - key: ASPNETCORE_ENVIRONMENT
        value: "LocalDevelopment"
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: AllowedHosts
        value: "*"
      - key: HTTP_PORTS
        value: "8080"
      # Embedded SQLite — no external database or cloud dependency.
      - key: ConnectionStrings__wcmdb
        value: "Data Source=/tmp/wcm-api/wcm.db"
