apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: wolfi-buildpacks-build
  annotations:
    openchoreo.dev/description: >-
      Build step using Wolfi (Chainguard) buildpacks builder.
      Distroless run images, deterministic builds, CycloneDX SBOM.
spec:
  templates:
    - name: build-image
      inputs:
        parameters:
          - name: git-revision
      container:
        # Reuses OpenChoreo's podman-runner (has pack + podman + jq)
        image: ghcr.io/openchoreo/podman-runner:v1.0
        command:
          - sh
          - -c
        args:
          - |-
            set -e

            WORKDIR=/mnt/vol/source

            IMAGE="{{workflow.parameters.image-name}}:{{workflow.parameters.image-tag}}-{{inputs.parameters.git-revision}}"
            APP_PATH="{{workflow.parameters.app-path}}"
            BUILD_ENV_JSON='{{workflow.parameters.build-env}}'
            BUILDER="{{workflow.parameters.builder-image}}"

            # --- Parameter Validation ---
            echo ">> Image: $IMAGE"
            echo ">> App path: $APP_PATH"
            echo ">> Builder: $BUILDER"

            if [ ! -d "$WORKDIR/$APP_PATH" ]; then
              echo ">> Error: The specified application path '$APP_PATH' does not exist in the repository"
              echo ">> Repository contents:"
              ls -la "$WORKDIR/"
              exit 1
            fi

            mkdir -p /etc/containers
            cat > /etc/containers/storage.conf <<EOF
            [storage]
            driver = "overlay"
            runroot = "/run/containers/storage"
            graphroot = "/var/lib/containers/storage"
            [storage.options.overlay]
            mount_program = "/usr/bin/fuse-overlayfs"
            EOF

            echo ">> Initializing build environment"
            podman system service --time=0 &
            until podman info --format '{{.Host.RemoteSocket.Exists}}' 2>/dev/null | grep -q true; do sleep 1; done

            # Authenticate to ACR for pulling the builder image
            REGISTRY_SECRET="/var/run/secrets/registry/.dockerconfigjson"
            if [ -f "$REGISTRY_SECRET" ]; then
              echo ">> Configuring registry authentication"
              mkdir -p "$HOME/.docker"
              cp "$REGISTRY_SECRET" "$HOME/.docker/config.json"
            fi

            # Build --env flags from the buildEnv JSON array
            ENV_ARGS=""
            if [ -n "$BUILD_ENV_JSON" ] && [ "$BUILD_ENV_JSON" != "[]" ]; then
              ENV_ARGS=$(echo "$BUILD_ENV_JSON" | \
                podman run --rm -i ghcr.io/jqlang/jq:1.7.1 -r '.[] | "--env \(.name)=\(.value)"' | \
                tr '\n' ' ')
            fi

            echo ">> Building image with Wolfi buildpacks"
            /usr/local/bin/pack build "$IMAGE" \
              --builder "$BUILDER" \
              --docker-host inherit \
              --path "$WORKDIR/$APP_PATH" \
              --pull-policy always \
              --trust-builder \
              $ENV_ARGS

            echo ">> Image built successfully"
            echo ">> Saving image"
            podman save -o /mnt/vol/app-image.tar "$IMAGE"
        securityContext:
          # Required for podman fuse-overlayfs -- same as paketo-buildpacks-build
          privileged: true
        volumeMounts:
          - mountPath: /mnt/vol
            name: workspace
          - mountPath: /var/run/secrets/registry
            name: registry-secret
            readOnly: true
      volumes:
        - name: registry-secret
          secret:
            secretName: "{{workflow.parameters.registry-push-secret}}"
            optional: true
