{{- if not .Values.openchoreo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wcm-api.fullname" . }}
  labels:
    {{- include "wcm-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "wcm-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
