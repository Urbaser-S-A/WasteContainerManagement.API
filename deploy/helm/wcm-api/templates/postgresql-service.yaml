{{- if and .Values.postgresql.enabled (not .Values.openchoreo.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wcm-api.fullname" . }}-postgresql
  labels:
    {{- include "wcm-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  selector:
    {{- include "wcm-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: postgresql
{{- end }}
